name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64-gcc14,   os: ubuntu-24.04,     cc: gcc-14,   cxx: g++-14 }
          - { name: linux-x64-clang19, os: ubuntu-24.04,     cc: clang-19, cxx: clang++-19 }
          - { name: linux-arm64-gcc14, os: ubuntu-24.04-arm, cc: gcc-14,   cxx: g++-14 }
          # macOS: the runtime is built for 10.15 (CMakeLists.txt's default), the tools for 13.3, on Apple Silicon and Intel.
          - { name: macos-arm64,       os: macos-latest }
          - { name: macos-x64,         os: macos-15-intel }
          - { name: windows-x64,       os: windows-2022 }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # Compiler errors and warnings become annotations on the commit (file,
      # line and message), readable on GitHub without opening the log.
      - name: Annotate compiler messages
        shell: bash
        run: echo "::add-matcher::.github/matchers/compilers.json"
      # GCC 14's libstdc++ provides <print>; Clang on Linux uses it too.
      - name: Install compilers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-14 ${{ startsWith(matrix.cc, 'clang') && matrix.cc || '' }}
          # Mesa's software Vulkan driver (llvmpipe) and the validation layer, so the renderer tests run;
          # a virtual display, so the menu's preview does.
          sudo apt-get install -y -qq mesa-vulkan-drivers vulkan-validationlayers xvfb
          # SDL3's window, input and audio back ends (the build fetches SDL itself).
          sudo apt-get install -y -qq libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev \
            libxtst-dev libwayland-dev libxkbcommon-dev wayland-protocols libdecor-0-dev libegl-dev libasound2-dev \
            libpulse-dev libpipewire-0.3-dev libudev-dev libdbus-1-dev
      - name: Configure
        shell: bash
        run: |
          args=()
          if [ -n "${{ matrix.cxx }}" ]; then
            args+=(-DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }})
          fi
          if [ "${{ runner.os }}" = Windows ]; then args+=(-DQILIN_REQUIRE_LAUNCHER_TESTS=ON); fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DQILIN_WERROR=ON "${args[@]}"
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a env QILIN_REQUIRE_VULKAN=1 ctest --test-dir build -C Release --output-on-failure
          else
            ctest --test-dir build -C Release --output-on-failure
          fi
